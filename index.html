<script>
let records = JSON.parse(localStorage.getItem("records") || "[]");
let customers = JSON.parse(localStorage.getItem("customers") || "[]");

function saveData() {
    localStorage.setItem("records", JSON.stringify(records));
    localStorage.setItem("customers", JSON.stringify(customers));
}

function addRecord() {
    const name = document.getElementById("customer").value;
    const item = document.getElementById("item").value;
    const cost = Number(document.getElementById("cost").value);
    const price = Number(document.getElementById("price").value);
    const date = document.getElementById("date").value;

    if (!name || !price) return alert("請填寫必要欄位");

    records.unshift({
        id: Date.now(),
        name, item, cost, price, date,
        paid: false
    });

    saveData();
    render();
}

function togglePaid(id) {
    const r = records.find(r => r.id === id);
    r.paid = !r.paid;
    saveData();
    render();
}

function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    saveData();
    render();
}

function addCustomer() {
    const input = document.getElementById("newCustomer");
    const name = input.value.trim();
    if (!name) return;

    customers.push(name);
    input.value = "";
    saveData();
    renderCustomers();
}

function removeCustomer(name) {
    customers = customers.filter(c => c !== name);
    saveData();
    renderCustomers();
}

function renderCustomers() {
    const box = document.getElementById("customerList");
    if (!box) return;

    box.innerHTML = customers.length
        ? customers.map(c => `
            <div class="customer-tag">
                ${c}
                <span class="remove-tag" onclick="removeCustomer('${c}')">×</span>
            </div>
        `).join("")
        : `<div class="no-customers">尚未建立客戶</div>`;
}

function render() {
    const list = document.getElementById("recordList");
    if (!list) return;

    let pending = 0;
    let weekly = 0;
    let total = 0;

    list.innerHTML = records.map(r => {
        if (!r.paid) pending += r.price;
        else weekly += r.price;
        total += r.price;

        return `
        <div class="record-item ${r.paid ? 'paid' : ''}">
            <div class="record-top">
                <div class="rec-name">${r.name}</div>
                <div class="order-date">${r.date || ''}</div>
            </div>

            <div class="info-row">
                <span>${r.item || ''}</span>
                <span>$${r.price}</span>
            </div>

            <div class="check-btn" onclick="togglePaid(${r.id})"></div>
            <span class="delete-btn" onclick="deleteRecord(${r.id})">刪除</span>
        </div>
        `;
    }).join("");

    document.getElementById("pendingCash").innerText = "$" + pending;
    document.getElementById("weeklySettled").innerText = "$" + weekly;
    document.getElementById("totalRevenue").innerText = "$" + total;
    document.getElementById("totalCount").innerText = records.length;
}

render();
renderCustomers();
</script>
