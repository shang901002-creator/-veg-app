<script>
/* ── helpers ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── avatar ── */
(function loadAvatar(){
    const saved = localStorage.getItem('veggie_avatar');
    if(saved){
        const img = document.getElementById('avatarImg');
        const emoji = document.getElementById('avatarEmoji');
        img.src = saved;
        img.style.display = 'block';
        emoji.style.display = 'none';
    }
})();

function changeAvatar(input){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const data = e.target.result;
        localStorage.setItem('veggie_avatar', data);
        const img = document.getElementById('avatarImg');
        const emoji = document.getElementById('avatarEmoji');
        img.src = data;
        img.style.display = 'block';
        emoji.style.display = 'none';
    };
    reader.readAsDataURL(file);
}

/* ── bubbles ── */
(function spawnBubbles(){
    const page = document.getElementById('welcomePage');
    [18,24,14,30,20,16,26,12,22,28].forEach(size=>{
        const b = document.createElement('div');
        b.className = 'bubble';
        b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*90+5}%;animation-duration:${7+Math.random()*8}s;animation-delay:${-Math.random()*12}s;`;
        page.appendChild(b);
    });
})();

/* ── data ── */
document.getElementById('date').valueAsDate = new Date();
let records     = JSON.parse(localStorage.getItem('veggie_v3_orders'))   || [];
let customers   = JSON.parse(localStorage.getItem('veggie_customers'))   || [];
let settlements = JSON.parse(localStorage.getItem('veggie_settlements')) || {};
let hidePaid = false;

function saveAll(){
    localStorage.setItem('veggie_v3_orders',   JSON.stringify(records));
    localStorage.setItem('veggie_settlements', JSON.stringify(settlements));
}
function saveCustomers(){ localStorage.setItem('veggie_customers', JSON.stringify(customers)); }

/* ── filter ── */
function toggleFilter(){
    hidePaid = !hidePaid;
    document.getElementById('filterBtn').textContent = hidePaid ? '顯示全部' : '隱藏已結清';
    render();
}

/* ── sections ── */
function toggleSection(bodyId, iconId){
    const body = document.getElementById(bodyId);
    const icon = document.getElementById(iconId);
    const open = body.classList.toggle('open');
    icon.textContent = open ? '－' : '＋';
}
function toggleWeekly(){
    const body = document.getElementById('weeklyBody');
    const icon = document.getElementById('weeklyIcon');
    const open = body.style.display === 'none';
    body.style.display = open ? 'block' : 'none';
    icon.textContent = open ? '－' : '＋';
}

/* ── customers ── */
function addCustomer(){
    const input = document.getElementById('newCustomerInput');
    const name = input.value.trim();
    if(!name) return;
    if(customers.includes(name)){ alert('此客人已存在'); return; }
    customers.push(name); saveCustomers(); input.value = '';
    renderCustomerTags(); renderCustomerSelect(); renderWeeklySummary();
}
function removeCustomer(name){
    if(!confirm(`確定刪除客人「${name}」？`)) return;
    customers = customers.filter(c=>c!==name); saveCustomers();
    renderCustomerTags(); renderCustomerSelect(); renderWeeklySummary();
}
function renderCustomerTags(){
    const list = document.getElementById('customerTagList');
    if(!customers.length){ list.innerHTML='<div class="no-customers">尚無客人，請新增</div>'; return; }
    list.innerHTML = customers.map(n=>`<div class="customer-tag"><span>${esc(n)}</span><span class="remove-tag" onclick="removeCustomer(${JSON.stringify(n)})">×</span></div>`).join('');
}
function renderCustomerSelect(){
    const sel = document.getElementById('customerSelect');
    const cur = sel.value;
    sel.innerHTML = '<option value="">— 請選擇客人 —</option>';
    customers.forEach(n=>{
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        if(n===cur) o.selected = true;
        sel.appendChild(o);
    });
    updatePreview();
}
function updatePreview(){
    const c = document.getElementById('customerSelect').value;
    const s = document.getElementById('itemSuffix').value.trim();
    const p = document.getElementById('itemPreview');
    if(!c&&!s){ p.innerHTML=''; return; }
    p.innerHTML = `紀錄將顯示為：<strong>${esc([c,s].filter(Boolean).join(' '))}</strong>`;
}

/* ── week helpers ── */
let weekOffset = 0;
function changeWeek(d){ weekOffset += d; renderWeeklySummary(); }
function toLocalDateStr(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
}
function getWeekKeyByOffset(offset){
    const d = new Date();
    const day = d.getDay()||7;
    d.setDate(d.getDate()-day+1+offset*7);
    return toLocalDateStr(d);
}
function getWeekRangeText(mondayStr){
    const mon = new Date(mondayStr+'T00:00:00');
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const fmt = d=>`${d.getMonth()+1}/${d.getDate()}`;
    return `${fmt(mon)} － ${fmt(sun)}`;
}
function getWeekDisplayLabel(o){
    if(o===0) return '本週'; if(o===-1) return '上週'; if(o<-1) return `${Math.abs(o)} 週前`; return null;
}
function getMondayOf(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr+'T00:00:00');
    const day = d.getDay()||7; d.setDate(d.getDate()-day+1);
    return toLocalDateStr(d);
}

/* ── weekly summary ── */
function renderWeeklySummary(){
    const el       = document.getElementById('weeklySummaryList');
    const labelEl  = document.getElementById('weekLabel');
    const rangeEl  = document.getElementById('weekRangeLabel');
    const nextBtn  = document.getElementById('weekNextBtn');
    const monthBar = document.getElementById('monthBar');

    if(weekOffset>0) weekOffset=0;
    nextBtn.disabled = (weekOffset===0);

    const weekKey = getWeekKeyByOffset(weekOffset);
    labelEl.textContent = getWeekDisplayLabel(weekOffset) || weekKey;
    rangeEl.textContent = getWeekRangeText(weekKey);

    const monthKey = weekKey.slice(0,7);
    const [y,m] = monthKey.split('-');
    const monthRecs   = records.filter(r=>r.date && r.date.slice(0,7)===monthKey);
    const monthTotal  = monthRecs.reduce((s,r)=>s+(Number(r.price)||0),0);
    const monthUnpaid = monthRecs.filter(r=>!r.isPaid).reduce((s,r)=>s+(Number(r.price)||0),0);
    monthBar.innerHTML = `
        <span class="month-bar-label">📅 ${y} 年 ${parseInt(m)} 月總計</span>
        <div style="text-align:right">
            <span class="month-bar-amount">$${monthTotal.toLocaleString()}</span>
            ${monthUnpaid>0?`<span style="font-size:11px;color:var(--l-mid);display:block;">未結 $${monthUnpaid.toLocaleString()}</span>`:''}
        </div>`;

    const thisWeekRecs = records.filter(r=>r.date && getMondayOf(r.date)===weekKey);
    const amountMap = {};
    customers.forEach(c=>{ amountMap[c]=0; });
    thisWeekRecs.forEach(r=>{
        if(r.customerName && amountMap[r.customerName]!==undefined)
            amountMap[r.customerName] += Number(r.price)||0;
    });

    const weekTotal  = Object.values(amountMap).reduce((a,b)=>a+b,0);
    const settledMap = settlements[weekKey]||{};
    const rows = customers.map(name=>({
        name,
        amount:     amountMap[name]||0,
        settled:    !!settledMap[name],
        settledAmt: settledMap[name] ? (settledMap[name].amount||0) : 0,
        recs:       thisWeekRecs.filter(r=>r.customerName===name)
    })).filter(r=>r.amount>0 || r.settled);

    if(!rows.length){ el.innerHTML='<div class="no-pending">這週沒有紀錄</div>'; return; }

    const isNow = weekOffset===0;
    el.innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;border-bottom:1px solid var(--l-border);margin-bottom:10px;">
            <span style="font-size:12px;color:var(--l-light);">本週小計</span>
            <span style="font-size:20px;font-weight:700;color:var(--l-ink);">$${weekTotal.toLocaleString()}</span>
        </div>` +
        rows.map(({name,amount,settled,settledAmt,recs})=>{
            const unpaidCount = recs.filter(r=>!r.isPaid).length;
            const detailHTML  = recs.map(r=>
                `<div class="detail-line">
                    <span>${r.date.slice(5).replace('-','/')}　${esc(r.itemName.replace(name,'').trim()||'－')}</span>
                    <span style="color:${r.isPaid?'var(--l-light)':'var(--l-ink)'};">
                        ${r.isPaid?'<s>':''}$${Number(r.price).toLocaleString()}${r.isPaid?'</s>':''}
                    </span>
                </div>`).join('');
            const meta = settled
                ? `✅ 已結清　週結：$${settledAmt.toLocaleString()}`
                : (unpaidCount>0 ? `${unpaidCount} 筆未結清` : '全數已打勾');
            const btn = isNow
                ? (settled
                    ? `<button class="settle-btn undo" onclick="undoSettle(${JSON.stringify(name)})">取消</button>`
                    : `<button class="settle-btn" onclick="settleCustomer(${JSON.stringify(name)})">結清</button>`)
                : '';
            return `<div class="customer-row ${settled?'settled':''}">
                <div class="customer-row-top">
                    <div>
                        <div class="customer-row-name ${settled?'done':''}">${esc(name)}</div>
                        <div class="customer-row-meta">${meta}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="customer-row-amount ${settled?'done':''}">$${amount.toLocaleString()}</span>
                        ${btn}
                    </div>
                </div>
                ${detailHTML}
            </div>`;
        }).join('');
}

function settleCustomer(name){
    const weekKey = getWeekKeyByOffset(weekOffset);
    if(!settlements[weekKey]) settlements[weekKey]={};
    const amount = records.filter(r=>!r.isPaid&&r.customerName===name&&getMondayOf(r.date)===weekKey).reduce((s,r)=>s+(Number(r.price)||0),0);
    settlements[weekKey][name] = {at:new Date().toISOString(), amount};
    records = records.map(r=>(!r.isPaid&&r.customerName===name&&getMondayOf(r.date)===weekKey)?{...r,isPaid:true}:r);
    saveAll(); render();
}
function undoSettle(name){
    const weekKey = getWeekKeyByOffset(weekOffset);
    if(settlements[weekKey]) delete settlements[weekKey][name];
    saveAll(); renderWeeklySummary();
}

/* ── main render ── */
function render(){
    const listEl = document.getElementById('recordList');
    listEl.innerHTML = '';
    let rev=0, pending=0;
    records.forEach((r,i)=>{
        const price = Number(r.price)||0;
        rev += price; if(!r.isPaid) pending += price;
        if(hidePaid && r.isPaid) return;
        listEl.insertAdjacentHTML('afterbegin',`
            <div class="record-item ${r.isPaid?'paid':''}">
                <div class="check-btn" onclick="togglePaid(${i})"></div>
                <div class="record-top">
                    <span class="rec-name">${esc(r.itemName||'')}</span>
                    <span class="order-date">${r.date}</span>
                </div>
                <div class="info-row"><span>金額：$${price}</span></div>
                ${r.note?`<div class="address-box">📍 ${esc(r.note)}</div>`:''}
                <span class="delete-btn" onclick="deleteRecord(${i})">刪除紀錄</span>
            </div>`);
    });

    const weekKey    = getWeekKeyByOffset(0);
    const settledMap = settlements[weekKey]||{};
    let weeklySettledAmt = 0;
    Object.values(settledMap).forEach(s=>{ weeklySettledAmt += Number(s.amount)||0; });

    document.getElementById('totalRevenue').innerText  = `$${rev.toLocaleString()}`;
    document.getElementById('pendingCash').innerText   = `$${pending.toLocaleString()}`;
    document.getElementById('weeklySettled').innerText = `$${weeklySettledAmt.toLocaleString()}`;
    document.getElementById('totalCount').innerText    = `${records.length} 筆`;
    document.getElementById('recordCount').innerText   = `共 ${records.length} 筆`;
    renderWeeklySummary();
    saveAll();
}

function addRecord(){
    const customerName = document.getElementById('customerSelect').value;
    const suffix = document.getElementById('itemSuffix').value.trim();
    if(!customerName && !suffix) return alert('請選擇客人或輸入品項');
    records.push({
        date: document.getElementById('date').value,
        customerName,
        itemName: [customerName,suffix].filter(Boolean).join(' '),
        price:    document.getElementById('price').value||0,
        note:     document.getElementById('note').value,
        isPaid:   false
    });
    ['itemSuffix','price','note'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('itemPreview').innerHTML = '';
    render();
}
function togglePaid(i){ records[i].isPaid = !records[i].isPaid; render(); }
function deleteRecord(i){ if(confirm('確定刪除？')){ records.splice(i,1); render(); } }
function clearAll(){ if(confirm('將刪除所有資料，確定嗎？')){ records=[]; saveAll(); render(); } }

function exportCSV(){
    if(!records.length) return;
    let csv = "\uFEFF日期,客人,品項,金額,狀態,備註\n";
    records.forEach(r=>{ csv += `${r.date},${r.customerName||''},${r.itemName},${r.price},${r.isPaid?'已結':'未結'},${r.note}\n`; });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download = `蔬菜帳本_${new Date().toLocaleDateString()}.csv`;
    a.click();
}

/* ── ✅ 修正後的 LINE 備份功能 ── */
function buildBackupText(){
    const weekKey  = getWeekKeyByOffset(0);
    const weekRecs = records.filter(r=>r.date && getMondayOf(r.date)===weekKey);
    if(!weekRecs.length) return null;

    const sun = new Date(weekKey+'T00:00:00'); sun.setDate(sun.getDate()+6);
    const fmt = d=>`${d.getMonth()+1}/${d.getDate()}`;
    let text = `${fmt(new Date(weekKey+'T00:00:00'))}-${fmt(sun)}\n`;

    const co=[], cm={};
    weekRecs.forEach(r=>{
        const c = r.customerName || r.itemName || '其他';
        if(!cm[c]){ cm[c]=[]; co.push(c); }
        cm[c].push(r);
    });
    const wt=[];
    co.forEach((c,idx)=>{
        const amounts = cm[c].map(r=>Number(r.price)||0);
        const total   = amounts.reduce((a,b)=>a+b,0); wt.push(total);
        text += `${idx+1}.${c}：${amounts.join('+')} ＝ ${total.toLocaleString()}\n`;
    });
    if(co.length>1) text += `${wt.join('+')} ＝ ${wt.reduce((a,b)=>a+b,0).toLocaleString()}\n`;
    text += `─────────────────`;
    return text;
}

function backupToLine(){
    const text = buildBackupText();
    if(!text){ alert('本週還沒有任何紀錄'); return; }

    // 顯示彈窗
    document.getElementById('backupText').value = text;
    document.getElementById('backupModal').style.display = 'flex';
    document.getElementById('modalHint').textContent = '正在嘗試自動複製…';
    document.getElementById('modalHint').style.color = '#888';
    const copyBtn = document.getElementById('modalCopyBtn');
    copyBtn.textContent = '複製文字';
    copyBtn.className = 'modal-copy-btn';

    // 嘗試自動複製（現代 API）
    setTimeout(async ()=>{
        try {
            await navigator.clipboard.writeText(text);
            document.getElementById('modalHint').textContent = '✅ 已自動複製！開啟 LINE 貼上即可';
            document.getElementById('modalHint').style.color = '#2e7d32';
            copyBtn.textContent = '✅ 已複製';
            copyBtn.className = 'modal-copy-btn success';
        } catch(e){
            document.getElementById('modalHint').textContent = '請點「複製文字」，再開啟 LINE 貼上';
            document.getElementById('modalHint').style.color = '#888';
        }
    }, 200);
}

async function doCopy(){
    const text = document.getElementById('backupText').value;
    const copyBtn = document.getElementById('modalCopyBtn');
    const hint = document.getElementById('modalHint');

    try {
        // 優先用現代 Clipboard API
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '✅ 已複製！';
        copyBtn.className = 'modal-copy-btn success';
        hint.textContent = '已複製！開啟 LINE 貼上即可';
        hint.style.color = '#2e7d32';
    } catch(e){
        // fallback：選取 textarea 讓使用者手動複製
        const ta = document.getElementById('backupText');
        ta.focus();
        ta.select();
        // 再嘗試舊 API
        try {
            document.execCommand('copy');
            copyBtn.textContent = '✅ 已複製！';
            copyBtn.className = 'modal-copy-btn success';
            hint.textContent = '已複製！開啟 LINE 貼上即可';
            hint.style.color = '#2e7d32';
        } catch(e2){
            copyBtn.textContent = '請長按文字框全選複製';
            hint.textContent = '⚠️ 請長按上方文字框，全選後手動複製';
            hint.style.color = '#e65100';
        }
    }
}

function closeBackupModal(){
    document.getElementById('backupModal').style.display = 'none';
}

/* ── tab switching ── */
function switchTab(tab){
    const ledger = document.getElementById('ledgerPage');
    const stats  = document.getElementById('statsPage');
    const navL   = document.getElementById('navLedger');
    const navS   = document.getElementById('navStats');
    if(tab==='ledger'){
        ledger.classList.add('visible');
        stats.classList.remove('visible');
        navL.classList.add('active');
        navS.classList.remove('active');
    } else {
        ledger.classList.remove('visible');
        stats.classList.add('visible');
        navL.classList.remove('active');
        navS.classList.add('active');
        renderStats();
    }
}

function doResetUnpaid(name){
    if(!confirm(`確定將「${name}」所有未結清歸零（標為已結清）？`)) return;
    records = records.map(r=> (r.customerName===name && !r.isPaid) ? {...r, isPaid:true} : r);
    saveAll(); render(); renderStats();
}

/* ── stats page ── */
function renderStats(){
    const overview = document.getElementById('statsOverview');
    const list     = document.getElementById('statsList');

    const nowMonth  = new Date().toISOString().slice(0,7);
    const thisWeek  = getWeekKeyByOffset(0);
    const [y,m]     = nowMonth.split('-');
    const monthRev  = records.filter(r=>r.date&&r.date.slice(0,7)===nowMonth).reduce((s,r)=>s+(Number(r.price)||0),0);
    const weekRev   = records.filter(r=>r.date&&getMondayOf(r.date)===thisWeek).reduce((s,r)=>s+(Number(r.price)||0),0);
    const totalUnpaid = records.filter(r=>!r.isPaid).reduce((s,r)=>s+(Number(r.price)||0),0);

    overview.innerHTML = `
        <div class="stat-card"><label>${parseInt(m)} 月收入</label><span>$${monthRev.toLocaleString()}</span></div>
        <div class="stat-card"><label>本週累計</label><span>$${weekRev.toLocaleString()}</span></div>
        <div class="stat-card"><label>未結清</label><span style="color:#e65100;">$${totalUnpaid.toLocaleString()}</span></div>`;

    list.innerHTML = '';
    if(!customers.length){ list.innerHTML='<div class="no-stats">尚無客人資料</div>'; return; }

    customers.forEach((name, idx)=>{
        const recs   = records.filter(r=>r.customerName===name);
        if(!recs.length) return;
        const total  = recs.reduce((s,r)=>s+(Number(r.price)||0),0);
        const paid   = recs.filter(r=>r.isPaid).reduce((s,r)=>s+(Number(r.price)||0),0);
        const unpaid = total - paid;
        const weekAmt= recs.filter(r=>r.date&&getMondayOf(r.date)===thisWeek).reduce((s,r)=>s+(Number(r.price)||0),0);

        const byWeek={};
        recs.forEach(r=>{ const wk=getMondayOf(r.date); if(!byWeek[wk])byWeek[wk]=[]; byWeek[wk].push(r); });

        const card   = document.createElement('div');
        card.className = 'cust-stat-card';

        const header = document.createElement('div');
        header.className = 'cust-stat-header';
        header.innerHTML = `
            <div>
                <div class="cust-name-big">${esc(name)}</div>
                <div class="cust-badges">
                    <span class="badge badge-total">本週 $${weekAmt.toLocaleString()}</span>
                    ${unpaid>0
                        ? `<span class="badge badge-unpaid">未結 $${unpaid.toLocaleString()}</span>`
                        : '<span class="badge badge-paid">全數已結</span>'}
                </div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
                <div class="cust-total-amt">$${total.toLocaleString()}</div>
                <div style="font-size:10px;color:var(--l-light);margin-top:2px;">累積</div>
            </div>`;
        header.addEventListener('click', ()=>{ body.classList.toggle('open'); });

        const body = document.createElement('div');
        body.className = 'cust-detail-body';
        body.id = 'cd'+idx;

        Object.keys(byWeek).sort().reverse().forEach(wk=>{
            const wRecs  = byWeek[wk];
            const wTotal = wRecs.reduce((s,r)=>s+(Number(r.price)||0),0);
            const group  = document.createElement('div');
            group.className = 'cust-month-group';
            let rowsHTML = `<div class="cust-month-label">${getWeekRangeText(wk)}　$${wTotal.toLocaleString()}</div>`;
            wRecs.forEach(r=>{
                rowsHTML += `<div class="cust-record-row">
                    <span class="cust-record-left">${r.date?r.date.slice(5).replace('-','/'):'-'}　${esc(r.itemName.replace(name,'').trim()||'－')}</span>
                    <span class="cust-record-right ${r.isPaid?'paid-item':''}">$${Number(r.price).toLocaleString()}</span>
                </div>`;
            });
            group.innerHTML = rowsHTML;
            body.appendChild(group);
        });

        const footer = document.createElement('div');
        footer.className = 'cust-stat-footer';
        footer.style.cssText = 'flex-direction:column;gap:8px;align-items:stretch;';
        const summary = document.createElement('div');
        summary.style.cssText = 'display:flex;justify-content:space-between;';
        summary.innerHTML = `<span>共 ${recs.length} 筆　累積 $${total.toLocaleString()}</span><span>未結 $${unpaid.toLocaleString()}</span>`;
        footer.appendChild(summary);

        if(unpaid > 0){
            const btn = document.createElement('button');
            btn.className = 'reset-unpaid-btn';
            btn.textContent = '歸零未結清（標為已結清）';
            btn.setAttribute('onclick', `doResetUnpaid(${JSON.stringify(name)})`);
            footer.appendChild(btn);
        }

        body.appendChild(footer);
        card.appendChild(header);
        card.appendChild(body);
        list.appendChild(card);
    });

    if(!list.children.length) list.innerHTML='<div class="no-stats">還沒有任何紀錄</div>';
}

/* ── page transitions ── */
function enterLedger(){
    document.getElementById('welcomePage').classList.add('slide-out');
    setTimeout(()=>{
        document.getElementById('welcomePage').style.display='none';
        document.getElementById('ledgerPage').classList.add('visible');
        document.getElementById('bottomNav').classList.add('visible');
    }, 750);
}
function backToWelcome(){
    document.getElementById('ledgerPage').classList.remove('visible');
    document.getElementById('statsPage').classList.remove('visible');
    document.getElementById('bottomNav').classList.remove('visible');
    const wp = document.getElementById('welcomePage');
    wp.style.display='flex';
    wp.classList.remove('slide-out');
}

renderCustomerTags();
renderCustomerSelect();
render();
